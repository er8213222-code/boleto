<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#fff,#fff0c7,#ffe1e1);color:#111}
.apartado{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
.apartado.activo{display:flex}
.card{width:min(430px,100%);background:#fff;border-radius:28px;padding:25px;text-align:center;box-shadow:0 16px 50px #0002}

h1{color:#d71920;font-size:30px;margin:10px 0}
p{color:#666}
button{width:100%;border:0;border-radius:17px;padding:17px;margin-top:18px;color:white;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#d71920,#ff9f00)}
.numero{font-size:64px;font-weight:900;letter-spacing:3px;margin:14px 0}
.buena{font-size:31px;font-weight:900;color:#d71920}
.copiar{background:#111}
.regresar{background:#777;font-size:14px}
</style>

const params=new URLSearchParams(location.search);
const boleto=(params.get("boleto")||"0001").padStart(4,"0");
document.getElementById("numero").textContent=boleto;

function verNumero(){
 document.getElementById("inicio").classList.remove("activo");
 document.getElementById("resultado").classList.add("activo");

 // Reproduce EXACTAMENTE el sonido de avioneta que enviaste.
 const sonido=document.getElementById("avioneta");
 sonido.currentTime=0;
 sonido.play().catch(()=>{});
}

async function copiar(){
 try{
   await navigator.clipboard.writeText(boleto);
   alert("Número de boleto copiado: "+boleto);
 }catch(e){
   prompt("Copia tu número de boleto:",boleto);
 }
}

function volver(){
 document.getElementById("resultado").classList.remove("activo");
 document.getElementById("inicio").classList.add("activo");
}
